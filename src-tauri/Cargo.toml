[package]
name = "upbstudio"
version = "0.1.0"
description = "UPb Studio: the unified desktop shell for the lab's LA-ICP-MS workflow"
authors = ["Yiming Zhang"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "upbstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multi-webview (Window::add_child), see ADR-0002.
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# "This computer" mode (ADR-0003): PostgreSQL 17 binaries from the theseus-rs
# builds, embedded at build time (`bundled`), version pinned through
# POSTGRESQL_VERSION in .cargo/config.toml. Only the installer part is used;
# initdb, start and stop are done by src/local_service/postgres.rs.
postgresql_embedded = { version = "0.22", features = ["bundled", "tokio"] }
getrandom = "0.3"
# Identity (plan decision 5): HTTP to laicpmsdb from Rust (no CORS or mixed
# content in the shell page), native TLS like postgresql_embedded already uses.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "query"] }
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

# Bearer tokens live in the OS keychain: macOS Keychain, Windows Credential Manager.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# The dialog plugin does not expose rfd's mixed files-and-folders panel.
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
