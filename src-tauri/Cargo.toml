[package]
name = "upbstudio"
version = "0.1.0"
description = "UPb Studio: the unified desktop shell for the lab's LA-ICP-MS workflow"
authors = ["Yiming Zhang"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "upbstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multi-webview (Window::add_child), see ADR-0002.
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-deep-link = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
