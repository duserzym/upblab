# Pre-release: runs on v* tags and by hand only; push triggers return at the first release (see README).
#
# Builds installers and signed updater artifacts on v* tags or manual dispatch.
# Tag builds attach artifacts to a draft release; manual builds upload workflow artifacts.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            bundles: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CI: true
      # postgresql_embedded's `bundled` feature downloads the pinned
      # PostgreSQL 17 build (src-tauri/.cargo/config.toml) from the
      # theseus-rs GitHub releases at build time; the token avoids the
      # anonymous API rate limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Caches the cargo registry, src-tauri/target and ~/.cargo/bin (so the
      # tauri-cli install below is a no-op after the first run).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2.11" --locked

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @lab/bridge
        run: pnpm --filter @lab/bridge build

      - name: Test bridge, shell UI and module pinning
        run: pnpm test

      # Archive cache of postgresql_embedded's build script (exact version).
      - uses: actions/cache@v4
        with:
          path: ~/.theseus/postgresql
          key: theseus-postgresql-${{ runner.os }}-${{ hashFiles('src-tauri/.cargo/config.toml') }}

      - name: Fetch pinned module builds
        # grainatlas has no release URL yet (modules.lock.json TODO) and its
        # local build is not in this checkout, so it is skipped and the Images
        # tab shows its placeholder. The laicpmsdb service bundle has no
        # release URL yet either: the installers are "Lab server only" builds
        # until laicpmsdb publishes it (docs/service-bundle-contract.md).
        run: node scripts/fetch-modules.mjs

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          make check-version
          VERSION=$(node scripts/check-version.mjs)
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: cargo tauri
          args: --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "UPb Lab ${{ github.ref_name }}"
          releaseBody: |
            Download the macOS .dmg or Windows .msi / -setup.exe below.
            See [Installing UPb Lab](https://github.com/duserzym/upblab/blob/main/docs/installing.md) for first-launch instructions.
            Later versions install from inside UPb Lab (Settings > Updates).

      - name: Test the Rust host
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      # initdb, start, role and database, orphan and stale-pid handling with
      # the bundled binaries. macOS only: GitHub's Windows runners run
      # elevated, and postgres.exe refuses to start under an administrator
      # token (UPb Lab users run unelevated).
      - name: Test the bundled PostgreSQL
        if: runner.os == 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml --release -- --ignored bundled_cluster

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: upbstudio-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 14
